# Lume override for Debian/Raspberry Pi OS triggerhappy.service
#
# Problem:
# - triggerhappy (thd) can start before udev finishes creating /dev/input/event*
# - thd does not reliably re-scan devices, so hotkeys may not work until
#   `systemctl restart triggerhappy`
#
# Fix:
# - wait for udev to settle and (soft) wait for /dev/input/event* before starting

[Unit]
Wants=systemd-udev-settle.service
After=systemd-udev-settle.service

[Service]
# Ensure /dev/input exists before thd starts, otherwise it may miss the keyboard
# until a manual restart. Non-fatal so systems without a keyboard still boot.
ExecStartPre=/bin/sh -c 'for i in $(seq 1 40); do ls /dev/input/event* >/dev/null 2>&1 && exit 0; sleep 0.25; done; exit 0'
